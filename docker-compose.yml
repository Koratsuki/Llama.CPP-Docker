---
services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:full-vulkan
    container_name: llama-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    devices:
      - /dev/dri:/dev/dri
    env_file: ./config/llamacpp.env
    command: >
      --server
      --host 0.0.0.0
      --port 8080
      --models-dir /models
      --models-autoload
      --models-max 1
      --gpu-layers 999
      --no-op-offload
      --ctx-size 8192
      --flash-attn on
      --jinja
      --reasoning off